[package]
name = "time_snapper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.100.0", features = ["chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Kun Linux: bruges til at tvinge X11, så "hold øverst" virker (Wayland tillader det ikke).
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30"
