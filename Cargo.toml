[package]
name = "time_snapper"
version = "0.4.0"
edition = "2024"
description = "Lille tidsregistreringsprogram til kunder og projekter"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.100.0", features = ["chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Samme version som eframe bruger; bruges til at spørge om skærme og flytte vinduet.
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
# Registrering af inaktivitet via Wayland-protokollen ext-idle-notify.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Ikon i systembakken via D-Bus StatusNotifierItem (KDE m.fl.), uden GTK.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
# Registrering af inaktivitet via GetLastInputInfo.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
# Ikon i systembakken.
tray-icon = { version = "0.26", default-features = false }

[build-dependencies]
winresource = "0.1.34"
